app-id: io.github.javi_jimenez.DesktopLauncherCreator
runtime: org.gnome.Platform
# Debe coincidir con el runtime/sdk que instalan los workflows de CI
# (org.gnome.Platform//49 y org.gnome.Sdk//49).
runtime-version: '49'
sdk: org.gnome.Sdk
command: desktop-launcher-creator

# El SDK de GNOME ya incluye PyGObject y pycairo (con los typelibs de GTK),
# por lo que no es necesario compilarlos. Solo instalamos la aplicación.
finish-args:
  # Interfaz gráfica (X11 y Wayland)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Acceso de solo lectura a los .desktop del sistema y del usuario
  - --filesystem=/usr/share/applications:ro
  - --filesystem=/usr/local/share/applications:ro
  - --filesystem=~/.local/share/applications:ro
  # Aplicaciones Snap y Flatpak instaladas
  - --filesystem=/var/lib/snapd/desktop/applications:ro
  - --filesystem=/var/lib/flatpak/exports/share/applications:ro
  - --filesystem=~/.local/share/flatpak/exports/share/applications:ro
  # Carpeta de destino por defecto y home para elegir destino
  - --filesystem=home

modules:
  - name: desktop-launcher-creator
    buildsystem: simple
    build-commands:
      # Instalar el paquete Python en /app (sin dependencias: las aporta el SDK)
      - pip3 install --prefix=/app --no-deps .
      # Integración de escritorio: .desktop, metadatos AppStream e icono
      - install -Dm644 packaging/common/io.github.javi_jimenez.DesktopLauncherCreator.desktop
        /app/share/applications/io.github.javi_jimenez.DesktopLauncherCreator.desktop
      - install -Dm644 packaging/common/io.github.javi_jimenez.DesktopLauncherCreator.metainfo.xml
        /app/share/metainfo/io.github.javi_jimenez.DesktopLauncherCreator.metainfo.xml
      - install -Dm644 packaging/common/io.github.javi_jimenez.DesktopLauncherCreator.svg
        /app/share/icons/hicolor/scalable/apps/io.github.javi_jimenez.DesktopLauncherCreator.svg
    sources:
      - type: dir
        path: ../..
