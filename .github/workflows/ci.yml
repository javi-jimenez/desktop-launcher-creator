name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev libgirepository1.0-dev \
            gir1.2-gtk-3.0 libcairo2-dev xvfb

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Instalar dependencias
        run: |
          poetry install
          poetry run pip install pytest

      - name: Compilar
        run: poetry run python -m compileall desktop_launcher_creator

      - name: Ejecutar pruebas
        run: xvfb-run -a poetry run pytest -q

      - name: Verificar arranque de la app (headless)
        run: |
          xvfb-run -a timeout 8 poetry run python -m desktop_launcher_creator.main || \
            test $? -eq 124
