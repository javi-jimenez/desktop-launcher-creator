name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Crear release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev libgirepository1.0-dev \
            gir1.2-gtk-3.0 libcairo2-dev

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry

      # La versión del paquete Python sale de pyproject.toml (ya sincronizada
      # con el tag al hacer `make release VERSION=x.y.z`).
      - name: Construir wheel + sdist
        run: poetry build

      - name: Construir paquete Debian
        run: bash packaging/deb/build.sh "${GITHUB_REF_NAME#v}"

      # El snapcraft.yaml lleva la versión fijada; la sobreescribimos con la del
      # tag para que Snap Store no rechace la revisión por versión duplicada.
      - name: Sincronizar versión del snap con el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: '${VERSION}'/" packaging/snap/snapcraft.yaml
          grep -n '^version:' packaging/snap/snapcraft.yaml

      - name: Construir Snap
        uses: snapcore/action-build@v1
        id: snapcraft
        continue-on-error: true
        with:
          path: packaging/snap
          # snapcraft 9.x falla en el runner (Permission denied en
          # /sys/kernel/mm/page_idle/bitmap via LXD); 8.x es estable.
          snapcraft-channel: 8.x/stable

      - name: Construir Flatpak
        continue-on-error: true
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak-builder --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.javi_jimenez.DesktopLauncherCreator.yml
          flatpak build-bundle repo desktop-launcher-creator.flatpak \
            io.github.javi_jimenez.DesktopLauncherCreator

      - name: Construir AppImage
        continue-on-error: true
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e VERSION="$VERSION" -e PROJECT_DIR=/work \
            appimagecrafters/appimage-builder:latest \
            appimage-builder --recipe packaging/appimage/AppImageBuilder.yml --skip-test

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            desktop-launcher-creator.flatpak
            desktop-launcher-creator-*.AppImage
            packaging/snap/*.snap
          generate_release_notes: true
