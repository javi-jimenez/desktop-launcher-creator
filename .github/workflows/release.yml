name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Crear release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev libgirepository1.0-dev \
            gir1.2-gtk-3.0 libcairo2-dev

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry

      - name: Construir paquete
        run: poetry build

      - name: Construir Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          flatpak-builder --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.javi_jimenez.DesktopLauncherCreator.yml
          flatpak build-bundle repo desktop-launcher-creator.flatpak \
            io.github.javi_jimenez.DesktopLauncherCreator

      - name: Construir Snap
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: packaging/snap

      - name: Copiar Snap a la raíz
        run: cp ${{ steps.snapcraft.outputs.snap }} .

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            desktop-launcher-creator.flatpak
            *.snap
          generate_release_notes: true
