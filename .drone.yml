# Pipeline de Drone CI — compatible con Gitea (gitea.app.brisecom.net)
# Drone se autoaloja junto a Gitea y no requiere un servidor externo.
kind: pipeline
type: docker
name: default

trigger:
  event:
    - push
    - tag
    - pull_request

steps:
  - name: test
    image: ubuntu:24.04
    commands:
      # Forzar IPv4: algunas redes Docker no tienen conectividad IPv6 y apt
      # resuelve los mirrors solo a AAAA, provocando fallos de conexión.
      - apt-get -o Acquire::ForceIPv4=true update
      - apt-get -o Acquire::ForceIPv4=true install -y python3 python3-pip python3-venv python3-dev python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libgirepository-2.0-dev libgirepository1.0-dev libcairo2-dev xvfb
      # PyGObject/pycairo se usan desde el sistema (python3-gi/python3-cairo),
      # evitando compilarlos y el conflicto con PEP 668.
      - pip install --break-system-packages -e . --no-deps
      - python3 -m compileall desktop_launcher_creator
      - |
        if python3 -c "import pytest" 2>/dev/null; then
          xvfb-run -a pytest -q
        else
          echo "pytest no instalado; se omite"
        fi
      - xvfb-run -a timeout 8 python3 -m desktop_launcher_creator.main || test $? -eq 124

  - name: build
    image: ubuntu:24.04
    commands:
      - apt-get -o Acquire::ForceIPv4=true update
      - apt-get -o Acquire::ForceIPv4=true install -y python3 python3-pip pipx
      - pipx install poetry
      - export PATH="$HOME/.local/bin:$PATH"
      - poetry build
    when:
      event:
        - tag
        - push
      branch:
        - main

  # Construye el bundle Flatpak. Requiere flatpak + flatpak-builder y el
  # runtime org.gnome.Platform 49 (se descarga de Flathub la primera vez).
  - name: flatpak
    image: ubuntu:24.04
    commands:
      - apt-get -o Acquire::ForceIPv4=true update
      - apt-get -o Acquire::ForceIPv4=true install -y flatpak flatpak-builder
      - flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
      - flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - flatpak-builder --force-clean --repo=repo build-dir packaging/flatpak/io.github.javi_jimenez.DesktopLauncherCreator.yml
      - flatpak build-bundle repo desktop-launcher-creator.flatpak io.github.javi_jimenez.DesktopLauncherCreator
    when:
      event:
        - tag
      status:
        - success

  # Construye el Snap. Se ejecuta en el contenedor oficial de snapcraft.
  # La versión se toma del tag para que Snap Store no rechace la revisión.
  - name: snap
    image: snapcore/snapcraft:stable
    commands:
      - apt-get update
      - apt-get install -y git
      - |
        sed -i "s/^version: .*/version: '${DRONE_TAG#v}'/" packaging/snap/snapcraft.yaml
      - cd packaging/snap && snapcraft --destructive-mode
      - cp packaging/snap/*.snap . 2>/dev/null || true
    when:
      event:
        - tag
      status:
        - success

  - name: deb
    image: ubuntu:24.04
    commands:
      - bash packaging/deb/build.sh "${DRONE_TAG#v}"
    when:
      event:
        - tag
      status:
        - success

  - name: appimage
    image: appimagecrafters/appimage-builder:latest
    commands:
      - PROJECT_DIR="$PWD" VERSION="${DRONE_TAG#v}" appimage-builder --recipe packaging/appimage/AppImageBuilder.yml --skip-test
    when:
      event:
        - tag
      status:
        - success

  - name: release
    image: plugins/gitea-release
    settings:
      base_url: https://gitea.app.brisecom.net
      api_key:
        from_secret: gitea_token
      files:
        - dist/*.whl
        - dist/*.tar.gz
        - dist/*.deb
        - desktop-launcher-creator.flatpak
        - "*.snap"
        - "*.AppImage"
      title: ${DRONE_TAG}
      note: Generado automáticamente por Drone CI
    when:
      event:
        - tag