# Pipeline de Drone CI — compatible con Gitea (gitea.app.brisecom.net)
# Drone se autoaloja junto a Gitea y no requiere un servidor externo.
kind: pipeline
type: docker
name: default

trigger:
  event:
    - push
    - tag
    - pull_request

steps:
  - name: test
    image: python:3.12-bookworm
    commands:
      - apt-get update
      # libgirepository-2.0-dev no existe en bookworm (solo en trixie/Ubuntu 24.04);
      # se instala de forma tolerante a fallos para que el pipeline funcione en ambos.
      - apt-get install -y libgirepository1.0-dev gir1.2-gtk-3.0 libcairo2-dev xvfb
      - apt-get install -y libgirepository-2.0-dev || true
      - pip install poetry
      - poetry config virtualenvs.create false
      - poetry install --no-interaction
      - python -m compileall desktop_launcher_creator
      - |
        if python -c "import pytest" 2>/dev/null; then
          xvfb-run -a pytest -q
        else
          echo "pytest no instalado; se omite"
        fi
      - xvfb-run -a timeout 8 python -m desktop_launcher_creator.main || test $? -eq 124

  - name: build
    image: python:3.12-bookworm
    commands:
      - pip install poetry
      - poetry build
    when:
      event:
        - tag
        - push
      branch:
        - main

  - name: release
    image: plugins/gitea-release
    settings:
      base_url: https://gitea.app.brisecom.net
      api_key:
        from_secret: gitea_token
      files:
        - dist/*.whl
        - dist/*.tar.gz
      title: ${DRONE_TAG}
      note: Generado automáticamente por Drone CI
    when:
      event:
        - tag